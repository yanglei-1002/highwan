server.port=8001
spring.profiles.active=@profileActive@
spring.application.name=highwan-web
eureka.client.service-url.defaultZone: http://localhost:8888/eureka/
feign.client.config.default.connect-timeout=10000
feign.client.config.default.readTimeout=10000
spring.main.allow-bean-definition-overriding=true
#ribbon.eureka.enabled=false

spring.resources.static-locations=classpath:/webapp/res/,file:${com.crazyplay.highwan.web.file_root_path}
spring.freemarker.suffix=.html
#使用模版html应该放在resources的templates目录下 可以通过下面配置修改
spring.freemarker.template-loader-path=classpath:/webapp/views/

spring.freemarker.allow-request-override=false
spring.freemarker.request-context-attribute=request
spring.freemarker.cache=true
spring.freemarker.check-template-location=true
spring.freemarker.charset=UTF-8
spring.freemarker.content-type=text/html
spring.freemarker.expose-request-attributes=false
spring.freemarker.expose-session-attributes=false
spring.freemarker.expose-spring-macro-helpers=false
spring.freemarker.settings.date_format=yyyy-MM-dd
spring.freemarker.settings.datetime_format=yyyy-MM-dd HH:mm:ss
spring.freemarker.settings.number_format=#.##
spring.freemarker.settings.classic_compatible=true
spring.freemarker.settings.template_exception_handler=debug
spring.freemarker.settings.tag_syntax=auto_detect
spring.freemarker.settings.template_update_delay=0
spring.freemarker.settings.locale=zh_CN
spring.freemarker.settings.default_encoding=UTF-8
spring.freemarker.settings.url_escaping_charset=UTF-8


# Redis数据库索引（默认为0）
spring.redis.database=0
# Redis服务器地址
spring.redis.host=182.61.39.126
# Redis服务器连接端口
spring.redis.port=6379
# Redis服务器连接密码（默认为空）
spring.redis.password=
# 连接池最大连接数（使用负值表示没有限制）
spring.redis.jedis.pool.max-active=200
# 连接池最大阻塞等待时间（使用负值表示没有限制）
spring.redis.jedis.pool.max-wait=10000ms
# 连接池中的最大空闲连
spring.redis.jedis.pool.max-idle=10
# 连接池中的最小空闲连接
spring.redis.jedis.pool.min-idle=0
# 连接超时时间（毫秒）
spring.redis.timeout=1000

com.crazyplay.highwan.ip.address.api=http://ip.taobao.com/service/getIpInfo.php?ip=%s

logging.level.com.crazyplay.highwan=debug
logging.config=classpath:logback.xml