</body>
</html>

[#macro header]
<header id="headApp">
    <nav>
        <!-- logo部分 -->
        <div class="logo">
            <img src="${basePath}/images/logo3.png" alt="">
        </div>

        <div class="address">
            <el-cascader v-model="parentNode" :options="addressNode" :props="props" node-key="id"  ref="addressCascader" :show-all-levels="false" clearable></el-cascader>
        </div>
        <!-- 导航栏部分 -->
        <div class="navbar">
            <ul>
                <li><a href="${basePath}/highwan/index">首页</a></li>
                <li><a href="${basePath}/party/add">发布活动</a></li>
                <!--<li><a href="#">详情</a></li>
                <li><a href="#">个人中心</a></li>-->
            </ul>
        </div>
        <!-- 个人中心 -->
        <div class="personal">
            <a href="">个人中心 <img src="" alt=""></a>
            <a href=""><img src="" alt="">杨大帅</a>
        </div>
        <!-- 搜索部分 -->
        <div class="search">
            <input type="text" v-model="searchText" placeholder="输入关键词">
            <input type="submit" value="搜索" @click="search">
        </div>
    </nav>
</header>
<script type="text/javascript">
    var main = {
        data: function () {
            return {
                address:'${address}',
				addressNode: [],
				parentNode:[],
                searchText:"",
				props: {
					value: 'id',
					label: 'name',
					children: 'childs',
					checkStrictly: true
				}
            }
        },
        methods: {
            initData: function () {
                var that = this;
                axios.get("/area/tree")
                    .then(function (response) {
                        console.log(response);
                        that.addressNode = response.data.data;
                        that.parentNode = new Array();
                        that.findParent(that.addressNode,that.address);
                        that.parentNode = that.parentNode.reverse();
                        console.log(that.parentNode);
                    })
                    .catch(function (error) {
                        console.log(error);
                    });
            },
            search:function(){
                app.initData();
            },
            findParent:function(nodes,parentId){
                if(nodes != null && nodes.length > 0){
                    for(var i = 0; i < nodes.length; i++){
                        if(nodes[i].id == parentId){
                            this.parentNode.push(nodes[i].id);
                            return;
                        }
                    }
                    if(this.parentNode.length <= 0){
                        for(var i = 0; i < nodes.length; i++){
                            var upParentId = nodes[i].id;
                            this.findParent(nodes[i].childs,parentId);
                            if(this.parentNode.length > 0){
                                this.parentNode.push(upParentId);
                                return;
                            }
                        }
                    }
                }
            },
            toPartyDetail: function (id) {
                /*window.location.href = '${basePath}/party/detail/'+id;*/
                window.open('${basePath}/party/detail/' + id);
            }
        },
        created: function () {
            this.initData();
            console.log(this.address);
        },
        mounted: function () {
        }
    };
    var constructor = Vue.extend(main);
    var headApp = new constructor().$mount('#headApp');
</script>
[/#macro]
