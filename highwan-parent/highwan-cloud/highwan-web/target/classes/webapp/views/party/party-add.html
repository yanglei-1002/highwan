[#include "/setting.html"]
[#import "/setting.html" as setting]
[@setting.html title="嗨玩网" ]
[@setting.header /]
<div class="app_container container" id="app" style="margin: 30px auto;">
    <el-form ref="form" :model="form" label-width="80px">
        <el-form-item label="活动标题">
            <el-input v-model="form.title" style="width: 36%;"></el-input>
        </el-form-item>
        <el-form-item label="活动地点">
            <el-input v-model="form.address" style="width: 36%;"></el-input>
        </el-form-item>
        <el-form-item label="活动费用">
            <el-input v-model="form.amount" style="width: 10%;"></el-input>&nbsp;元
        </el-form-item>
        <el-form-item label="活动时间">
            <el-date-picker
                    v-model="timeValue"
                    value-format="yyyy-MM-dd HH:mm:ss"
                    type="datetimerange"
                    range-separator="至"
                    start-placeholder="开始日期"
                    end-placeholder="结束日期">
            </el-date-picker>
        </el-form-item>
        <el-form-item label="活动类型">
            <el-cascader :options="treeNodes" :props="props" node-key="id" v-model="parentNode" ref="cascader" :show-all-levels="false" clearable></el-cascader>
        </el-form-item>
        <el-form-item label="活动介绍">
            <!-- 加载编辑器的容器 -->
            <script id="container" name="content" type="text/plain">
            </script>
        </el-form-item>
        <el-form-item>
            <el-button type="primary" @click="onSubmit">立即创建</el-button>
            <el-button>取消</el-button>
        </el-form-item>
    </el-form>
</div>
<script type="text/javascript">
    <!-- 实例化编辑器 -->
    var ue = UE.getEditor('container');
    var main = {
        data: function () {
            return {
                form: {
                    content: "",
                    startTime: "",
                    endTime: ""
                },
                timeValue: [],
                treeNodes: [],
				parentNode:"",
                props: {
                    value: 'id',
                    label: 'name',
                    children: 'childs',
                    checkStrictly: true
                }
            }
        },
        methods: {
			initCategoryData:function(){
				var that = this;
				axios.get("/party/category/tree")
						.then(function (response) {
							console.log(response.data.data);
							that.treeNodes = response.data.data;
						})
						.catch(function (error) {
							console.log(error);
						});
			},
            onSubmit: function () {
                this.form.content = ue.getContent();
                this.form.startTime = this.timeValue[0];
                this.form.endTime = this.timeValue[1];
                this.form.partyCategoryId = this.parentNode[this.parentNode.length-1];
                if(!this.form.partyCategoryId && 0 !== this.form.partyCategoryId ){
                    this.$message.error('请选择活动类型');
                    return;
                }
                /*var currentNode = this.$refs.cascader.getCheckedNodes();
                if(null == currentNode || undefined == currentNode){
                    return;
                }
                this.form.partyCategoryName = currentNode.label;*/
                var that = this;
                axios.post("/party/saveOrUpdate", that.form)
                    .then(function (response) {
                        console.log(response);
                        window.location.href = '${basePath}/highwan/index';
                    })
                    .catch(function (error) {
                        console.log(error);
                    });
            }
        },
        created: function () {
            this.initCategoryData();
        },
    };
    var constructor = Vue.extend(main);
    var app = new constructor().$mount('#app');
</script>
[@setting.footer /]
[/@setting.html]
